<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discovermarket Sticky Cards | Codegrid</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <section class="intro">
      <h1>Built different, shipped fast</h1>
    </section>

    <section class="spotlight">
      <div class="spotlight-layout">
        <div class="spotlight-track">
          <div class="spotlight-card">
            <div class="spotlight-face">
              <p>Drop us a line</p>
              <span class="spotlight-index">01</span>
            </div>
          </div>

          <div class="spotlight-card">
            <div class="spotlight-face">
              <p>We sketch the blueprint</p>
              <span class="spotlight-index">02</span>
            </div>
          </div>

          <div class="spotlight-card">
            <div class="spotlight-face">
              <p>We sweat the details</p>
              <span class="spotlight-index">03</span>
            </div>
          </div>

          <div class="spotlight-card">
            <div class="spotlight-face">
              <p>You hit publish</p>
              <span class="spotlight-arrow">
                <ion-icon name="arrow-forward"></ion-icon>
              </span>
            </div>
          </div>
        </div>

        <h1 class="spotlight-headline">
          Good things happen in four quick steps!
        </h1>
      </div>
    </section>

    <section class="outro">
      <h1>Your move</h1>
    </section>

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
    <script type="module" src="/script.js"></script>
  </body>
</html>
